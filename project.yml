name: OyuncuKimlik
options:
  bundleIdPrefix: tr.ercanatay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  OyuncuKimlik:
    type: application
    platform: macOS
    sources:
      - path: OyuncuKimlik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.oyuncukimlik
        PRODUCT_NAME: OyuncuKimlik
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oyuncu Kimlik
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_LANGUAGE: tr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - OyuncuKimlikTests
      gatherCoverageData: false
  OyuncuKimlikTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OyuncuKimlikTests
    dependencies:
      - target: OyuncuKimlik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.oyuncukimlik.tests
        GENERATE_INFOPLIST_FILE: YES
