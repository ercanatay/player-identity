name: PlayerIdentity
options:
  bundleIdPrefix: tr.ercanatay
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Shared by the app and the bundled CLI (§34).
    MARKETING_VERSION: "2.8.0"
    CURRENT_PROJECT_VERSION: "30"
targets:
  PlayerIdentity:
    type: application
    platform: macOS
    sources:
      - path: PlayerIdentity
    dependencies:
      # §34: the CLI ships inside the app as Contents/Helpers/playeridentityctl.
      - target: playeridentityctl
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: PlayerIdentity/Info.plist
      properties:
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: PlayerIdentity/PlayerIdentity.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      configs:
        # §26: Developer ID signing with hardened runtime for release builds; Debug stays ad-hoc
        # (local runs, unit tests and CI without certificates).
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: GJ3Y762WQ9
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.playeridentity
        PRODUCT_NAME: PlayerIdentity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Player Identity
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # §34 command-line helper; compiles the same Core sources as the app (no separate module).
  playeridentityctl:
    type: tool
    platform: macOS
    sources:
      - path: PlayerIdentity/Core
      - path: PlayerIdentity/CLI
      - path: PlayerIdentityCLI
    settings:
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: GJ3Y762WQ9
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      base:
        PRODUCT_NAME: playeridentityctl
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.playeridentity.ctl
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  PlayerIdentityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PlayerIdentityTests
      # Copies of the app sources for the literal scan (§18.3); read from the test bundle, not ~/Documents.
      - path: PlayerIdentity/App
        type: folder
        buildPhase: resources
        name: ScannedApp
      - path: PlayerIdentity/Core
        type: folder
        buildPhase: resources
        name: ScannedCore
      # §41: the Homebrew cask, linted by the tests (`ruby -c`) from the test bundle.
      - path: Casks
        type: folder
        buildPhase: resources
        name: CaskTemplate
    dependencies:
      - target: PlayerIdentity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.playeridentity.tests
        GENERATE_INFOPLIST_FILE: YES
  # §41 UI smoke test: local only (own scheme below; the PlayerIdentity scheme and CI do not run it).
  PlayerIdentityUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PlayerIdentityUITests
    dependencies:
      - target: PlayerIdentity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ercanatay.playeridentity.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlayerIdentity
schemes:
  PlayerIdentityUITests:
    build:
      targets:
        PlayerIdentity: all
        PlayerIdentityUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PlayerIdentityUITests
  PlayerIdentity:
    build:
      targets:
        PlayerIdentity: all
        PlayerIdentityTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # Existing tests assert the Turkish source texts; LocalizationTests switch languages explicitly.
      language: tr
      targets:
        - PlayerIdentityTests
