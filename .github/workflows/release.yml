name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize & publish
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # §26: without these secrets the release falls back to an ad-hoc build (marked "not notarized").
      HAS_SIGNING: ${{ secrets.APPLE_DEVID_CERT_P12 != '' && secrets.APPLE_DEVID_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_DEVID_CERT_P12 != '' && secrets.APPLE_ASC_KEY_P8 != '' && secrets.APPLE_ASC_KEY_ID != '' && secrets.APPLE_ASC_ISSUER_ID != '' }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_DEVID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application" >/dev/null
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare notary API key
        if: env.HAS_NOTARY == 'true'
        env:
          ASC_KEY: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY" > "$KEY"          # PEM
          else
            printf '%s' "$ASC_KEY" | base64 --decode > "$KEY"   # base64 of the .p8 file
          fi
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          NOTARIZE: ${{ env.HAS_NOTARY == 'true' && '1' || '0' }}
          NOTARY_TIMEOUT: 60m
        run: |
          set -euo pipefail
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID
          scripts/release.sh
          echo "RELEASE_STATUS=$(cat dist/release-status.txt)" >> "$GITHUB_ENV"
          echo "ZIP=$(ls dist/PlayerIdentity-*-macos.zip)" >> "$GITHUB_ENV"

      - name: Verify package
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/PlayerIdentity.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$RELEASE_STATUS" = notarized ]; then
            xcrun stapler validate "$APP"
            spctl -a -vv -t exec "$APP"
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$RELEASE_STATUS" in
            notarized) SIGNING="Signed with Developer ID (Rigicon, Inc.), notarized by Apple and stapled; opens without a Gatekeeper warning." ;;
            signed) SIGNING="Signed with Developer ID but **not notarized** (notary credentials missing): right-click → Open on first launch." ;;
            *) SIGNING="Ad-hoc signed, **not notarized** (signing secrets missing): right-click → Open on first launch." ;;
          esac
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## PlayerIdentity $VERSION"
            echo
            echo "**Signing:** $SIGNING"
            echo
            if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then cat "docs/release-notes/$GITHUB_REF_NAME.md"; echo; fi
            echo "### SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" "$ZIP" dist/SHA256SUMS.txt \
            --title "PlayerIdentity $VERSION" --verify-tag --notes-file "$NOTES"

      - name: Update Homebrew cask (§41, optional)
        if: env.RELEASE_STATUS == 'notarized'
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          git checkout -- Casks/player-identity.rb   # release.sh already updated the tag checkout
          git fetch origin main
          git checkout -B cask-update origin/main
          scripts/update-cask.sh "$VERSION" --from dist
          if git diff --quiet -- Casks/player-identity.rb; then echo "cask already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Homebrew cask to $VERSION" -- Casks/player-identity.rb
          git push origin HEAD:main

      - name: Sync Homebrew tap (optional)
        if: env.RELEASE_STATUS == 'notarized' && env.TAP_TOKEN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TMP="$RUNNER_TEMP/tap"; rm -rf "$TMP"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ercanatay/homebrew-tap.git" "$TMP"
          mkdir -p "$TMP/Casks"
          cp Casks/player-identity.rb "$TMP/Casks/player-identity.rb"
          cd "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/player-identity.rb
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "player-identity $VERSION"
          git push origin HEAD:main

      - name: Clean up keychain and key
        if: always()
        run: |
          [ -n "${SIGN_KEYCHAIN:-}" ] && security delete-keychain "$SIGN_KEYCHAIN" || true
          [ -n "${ASC_KEY_PATH:-}" ] && rm -f "$ASC_KEY_PATH" || true
