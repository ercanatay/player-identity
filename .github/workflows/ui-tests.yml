name: UI Tests

on:
  workflow_dispatch:

jobs:
  smoke:
    name: UI smoke
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & run UI smoke test
        continue-on-error: true
        run: |
          echo "Best-effort: GitHub macOS VM'inde uygulama penceresi görünmeyebilir; yerelde çalıştırın."
          xcodebuild test -project PlayerIdentity.xcodeproj -scheme PlayerIdentityUITests \
            -destination 'platform=macOS' -derivedDataPath .build-ui \
            -resultBundlePath .build-ui/TestResults.xcresult
      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: .build-ui/TestResults.xcresult
          retention-days: 7
      - name: Launch app for diagnostics
        if: always()
        continue-on-error: true
        run: |
          APP=.build-ui/Build/Products/Debug/PlayerIdentity.app
          if [ -d "$APP" ]; then
            open "$APP" --args -PIUITesting || true
            sleep 8
          else
            echo "App bulunamadı: $APP"
          fi
      - name: Capture screenshot
        if: always()
        continue-on-error: true
        run: screencapture -x /tmp/ci-screen.png || true
      - name: Window diagnostics
        if: always()
        continue-on-error: true
        run: |
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' || true
          osascript -e 'tell application "System Events" to tell process "PlayerIdentity" to count windows' || true
      - name: Collect unified log
        if: always()
        continue-on-error: true
        run: |
          log show --last 5m --predicate 'process == "PlayerIdentity"' --style compact | tail -80 > /tmp/pi-log.txt || true
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-diagnostics
          path: |
            /tmp/ci-screen.png
            /tmp/pi-log.txt
          retention-days: 7
